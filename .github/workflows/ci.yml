name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package-test-concurrency:
        description: Package-consumer slots (empty uses the runner setting or fixture default)
        type: string
        required: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Build and validate
        run: dotnet run --file ./eng/Ankus.Ci.cs -- quality

  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
            platform: linux
            architecture: x64
          - runner: macos-15
            rid: osx-arm64
            platform: osx
            architecture: arm64
          - runner: ${{ github.event_name == 'pull_request' && 'windows-2025' || 'ankus-windows-x64' }}
            rid: win-x64
            platform: windows
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Read runtime identity
        id: runtime
        run: dotnet run --file ./eng/Ankus.Ci.cs -- metadata

      - uses: actions/cache@v5
        id: runtime-cache
        with:
          path: artifacts/nativeaot/${{ matrix.rid }}
          key: nativeaot-v2-${{ matrix.rid }}-${{ steps.runtime.outputs.commit }}

      - uses: actions/checkout@v5
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.commit }}
          path: runtime

      - name: Build runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- runtime-build
          ${{ matrix.platform }}
          ${{ matrix.architecture }}
          ${{ matrix.rid }}

      - name: Pack runtime
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- runtime-pack
          ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: nativeaot-${{ matrix.rid }}
          path: artifacts/nativeaot/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-package-${{ matrix.rid }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 3

  test:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
            postgresql: 18
          - runner: macos-15
            rid: osx-arm64
            postgresql: 18
          - runner: ${{ github.event_name == 'pull_request' && 'windows-2025' || 'ankus-windows-x64' }}
            rid: win-x64
            postgresql: 17
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Select Windows C++ toolchain
        if: runner.os == 'Windows'
        run: dotnet run --file ./eng/Ankus.Ci.cs -- windows-toolchain

      - name: Restore NuGet package cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v5
        id: nuget-cache
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - uses: actions/download-artifact@v8
        with:
          name: nativeaot-${{ matrix.rid }}
          path: artifacts/nativeaot/${{ matrix.rid }}

      - name: Restore NuGet packages
        run: dotnet restore Ankus.slnx -p:Platform="Any CPU"

      - name: Save NuGet package cache
        if: runner.environment != 'self-hosted' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Restore native binding cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v5
        id: binding-cache
        with:
          path: artifacts/binding-cache
          key: bindings-v1-${{ runner.os }}-${{ runner.arch }}-pg${{ matrix.postgresql }}-${{ github.sha }}
          restore-keys: bindings-v1-${{ runner.os }}-${{ runner.arch }}-pg${{ matrix.postgresql }}-

      - name: Build PostgreSQL tests
        run: >-
          dotnet run --file ./eng/Ankus.Ci.cs -- runtime-test-build
          ${{ matrix.rid }}
          ${{ matrix.postgresql }}

      - name: Save native binding cache
        if: runner.environment != 'self-hosted' && steps.binding-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: artifacts/binding-cache
          key: ${{ steps.binding-cache.outputs.cache-primary-key }}

      - name: Run full PostgreSQL tests
        env:
          ANKUS_PACKAGE_TEST_CONCURRENCY: ${{ inputs.package-test-concurrency || (runner.environment == 'self-hosted' && vars.ANKUS_WINDOWS_PACKAGE_TEST_CONCURRENCY) || '' }}
        run: dotnet run --file ./eng/Ankus.Ci.cs -- runtime-test-run

      - name: Save test results and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs-${{ matrix.rid }}
          path: artifacts/test-logs/**
          if-no-files-found: ignore
          retention-days: 7
